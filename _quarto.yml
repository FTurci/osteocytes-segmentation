project:
  type: website
  resources:
    - "data/**"
    - "preliminary/groups/**"
  render:
    - index.qmd
    - analysis.qmd
    - preliminary.qmd
    - "series/*.qmd"

website:
  title: "Osteocyte segmentation"
  sidebar:
    style: docked
    contents:
      - index.qmd
      - analysis.qmd
      - preliminary.qmd
      - section: "Series"
        contents: "series/*.qmd"

format:
  html:
    theme: cosmo
    css: assets/site.css
    toc: true
    page-layout: full
    include-in-header:
      - text: |
          <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
          <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
    include-after-body: assets/scripts.html
